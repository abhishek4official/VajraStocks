[project]
name = "stocks"
version = "1.4.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "agent-framework>=1.7.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "click>=8.4.1",
    "fastapi>=0.136.3",
    "lightgbm>=4.6.0",
    "loguru>=0.7.3",
    "pandas>=3.0.3",
    "pandas-ta>=0.4.71b0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "psycopg2-binary>=2.9.0",
    "pyodbc>=5.3.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.48.0",
    "yfinance>=1.4.1",
]

[project.scripts]
nse-downloader = "stocks.main:cli"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade (modern syntax)
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
]
ignore = ["E501", "B905"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]
installer = [
    "pyinstaller>=6.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

