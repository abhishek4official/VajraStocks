app:
  env: production
  name: nse-historical-downloader
database:
  connection_string: sqlite:///data/vajra.db
  pool_size: 10
  max_overflow: 20
  pool_recycle: 1800
  provider: sqlite
downloader:
  history_years: 3
  batch_size: 50
  rate_limit_per_second: 5
  max_retries: 5
  backoff_factor: 2.0
  timeout_seconds: 30
symbols:
  active_equities_url: https://archives.nseindia.com/content/equities/EQUITY_L_ACTIVE.csv
  fallback_csv_path: config/EQUITY_L_ACTIVE.csv
  default_indices:
  - ^NSEI
  - ^NSEBANK
  include_indices: true
validation:
  max_price_pct_change_limit: 0.5
  enable_volume_check: true
  enable_empty_row_check: true
logging:
  console_level: INFO
  file_level: DEBUG
  file_path: logs/nse_downloader.log
  rotation: 10 MB
  retention: 30 days
ai:
  provider: ollama
  base_url: http://192.168.31.27:11434
  model: gemma4:e4b
