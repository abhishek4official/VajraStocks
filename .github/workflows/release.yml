name: Release — Build & Publish Installers

# Triggers:
#   • Push of a version tag  v*.*.*  (e.g. v1.0.0)
#   • Manual dispatch with an explicit version input
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.3 — no leading v)'
        required: true
        default: '1.0.0'

# ── Shared helpers ────────────────────────────────────────────────────────────
env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ── 1. Determine version from tag or manual input ─────────────────────────
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Strip leading 'v' from the tag ref
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. Build frontend once, reuse artifact across all platform jobs ────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── 3. Windows — PyInstaller + Inno Setup ─────────────────────────────────
  build-windows:
    name: Build Windows Installer
    needs: [version, build-frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Install ODBC (Windows SDK already has it — ensure headers)
        run: choco install -y visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64" || true

      - name: Install backend deps + PyInstaller
        working-directory: python
        run: |
          uv sync --frozen --all-groups
          uv pip install pyinstaller

      - name: Bundle with PyInstaller
        working-directory: python
        run: uv run pyinstaller ..\installer\vajrastocks.spec --distpath ..\dist --workpath ..\build

      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install -y innosetup
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc /Q installer\windows\setup.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/VajraStocks-Setup.exe
          retention-days: 1

  # ── 4. Linux — .deb, .rpm, AppImage ──────────────────────────────────────
  build-linux:
    name: Build Linux Packages
    needs: [version, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unixodbc-dev rpm patchelf imagemagick

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Install backend deps + PyInstaller
        working-directory: python
        run: |
          uv sync --frozen --all-groups
          uv pip install pyinstaller

      - name: Bundle with PyInstaller
        working-directory: python
        run: uv run pyinstaller ../installer/vajrastocks.spec --distpath ../dist --workpath ../build

      - name: Build .deb
        run: bash installer/linux/build-deb.sh ${{ needs.version.outputs.version }}

      - name: Build .rpm
        run: bash installer/linux/build-rpm.sh ${{ needs.version.outputs.version }}

      - name: Build AppImage
        run: bash installer/linux/build-appimage.sh ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            release/VajraStocks.deb
            release/VajraStocks.rpm
            release/VajraStocks.AppImage
          retention-days: 1

  # ── 5. macOS — PyInstaller + create-dmg ──────────────────────────────────
  build-macos:
    name: Build macOS DMG
    needs: [version, build-frontend]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Install backend deps + PyInstaller
        working-directory: python
        run: |
          # pyodbc on macOS needs unixodbc
          brew install unixodbc || true
          uv sync --frozen --all-groups
          uv pip install pyinstaller

      - name: Bundle with PyInstaller
        working-directory: python
        run: uv run pyinstaller ../installer/vajrastocks.spec --distpath ../dist --workpath ../build

      - name: Build macOS DMG
        run: bash installer/macos/build-dmg.sh ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/VajraStocks.dmg
          retention-days: 1

  # ── 6. Generate release notes + checksums, publish GitHub Release ─────────
  publish-release:
    name: Publish GitHub Release
    needs: [version, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git log range

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Flatten artifacts into release/ directory
        run: |
          mkdir -p release
          find release-assets/ -type f \
            \( -name "*.exe" -o -name "*.deb" -o -name "*.rpm" \
               -o -name "*.AppImage" -o -name "*.dmg" \) \
            -exec cp {} release/ \;

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Collect commits since the last tag (or all if first release)
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p' || true)
          if [[ -n "${PREV_TAG}" ]]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" | head -40)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" | head -40)
          fi

          cat > release/ReleaseNotes.md << EOF
          # VajraStocks v${VERSION}

          NSE Stock Analysis Platform — release **v${VERSION}**

          ## What's Changed
          ${COMMITS}

          ## Downloads

          | Platform | File |
          |----------|------|
          | Windows  | \`VajraStocks-Setup.exe\` |
          | Linux (Debian/Ubuntu) | \`VajraStocks.deb\` |
          | Linux (Fedora/RHEL)   | \`VajraStocks.rpm\` |
          | Linux (Universal)     | \`VajraStocks.AppImage\` |
          | macOS                 | \`VajraStocks.dmg\` |

          ## Installation

          ### Windows
          Run \`VajraStocks-Setup.exe\` and follow the installer wizard.

          ### Linux (.deb)
          \`\`\`bash
          sudo dpkg -i VajraStocks.deb
          \`\`\`

          ### Linux (.rpm)
          \`\`\`bash
          sudo rpm -i VajraStocks.rpm
          \`\`\`

          ### Linux (AppImage)
          \`\`\`bash
          chmod +x VajraStocks.AppImage && ./VajraStocks.AppImage
          \`\`\`

          ### macOS
          Open \`VajraStocks.dmg\`, drag VajraStocks to Applications.

          ---
          *Generated automatically by GitHub Actions.*
          EOF

          echo "notes_path=release/ReleaseNotes.md" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          cd release
          sha256sum VajraStocks-Setup.exe VajraStocks.deb VajraStocks.rpm \
            VajraStocks.AppImage VajraStocks.dmg 2>/dev/null > Checksums.txt || \
          sha256sum $(ls *.exe *.deb *.rpm *.AppImage *.dmg 2>/dev/null) > Checksums.txt || true
          cat Checksums.txt

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: VajraStocks v${{ needs.version.outputs.version }}
          body_path: release/ReleaseNotes.md
          draft: false
          prerelease: false
          files: |
            release/VajraStocks-Setup.exe
            release/VajraStocks.deb
            release/VajraStocks.rpm
            release/VajraStocks.AppImage
            release/VajraStocks.dmg
            release/ReleaseNotes.md
            release/Checksums.txt
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
