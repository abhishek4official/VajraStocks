name: Release — Build & Publish Installers

# Triggers:
#   • Push of a version tag  v*.*.*  (e.g. v2.1.0)
#   • Manual dispatch with an explicit version input
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.1.0 — no leading v)'
        required: true
        default: '2.1.0'

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ── 1. Resolve version from tag or manual input ───────────────────────────
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. Windows — frontend + PyInstaller + Electron (NSIS) ────────────────
  build-windows:
    name: Build Windows Installer
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Update version in source files
        run: python python/scripts/update_version.py ${{ needs.version.outputs.version }}

      # ── Frontend ─────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ── Backend ──────────────────────────────────────────────────────────
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install backend deps (including PyInstaller dev dep)
        working-directory: python
        run: uv sync --frozen --all-groups

      # ── PyInstaller bundle ───────────────────────────────────────────────
      # Output goes to python/dist/VajraStocks/ — this is what
      # electron/package.json extraResources points to.
      - name: Bundle backend with PyInstaller
        working-directory: python
        run: uv run pyinstaller ..\installer\vajrastocks.spec --noconfirm

      # ── Electron installer ───────────────────────────────────────────────
      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Build Electron installer (NSIS)
        shell: pwsh
        working-directory: electron
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Stamp version + output dir (UTF-8 no-BOM — PowerShell 5.1 safe)
          $pkg  = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = "$env:APP_VERSION"
          $pkg.build.directories.output = "..\release"
          $json = $pkg | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText("$PWD\package.json", $json, (New-Object System.Text.UTF8Encoding $false))
          npx electron-builder --win --x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rename installer to stable filename
        shell: pwsh
        run: |
          $f = Get-ChildItem release -Filter "VajraStocks Setup*.exe" | Select-Object -First 1
          if ($f) { Rename-Item $f.FullName "VajraStocks-Setup.exe" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/VajraStocks-Setup.exe
          retention-days: 1

  # ── 3. Linux — frontend + PyInstaller + deb / rpm / AppImage ─────────────
  build-linux:
    name: Build Linux Packages
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Update version in source files
        run: python python/scripts/update_version.py ${{ needs.version.outputs.version }}

      # ── Frontend ─────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ── Backend ──────────────────────────────────────────────────────────
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unixodbc-dev rpm patchelf imagemagick fuse
          sudo apt-get install -y libfuse2 2>/dev/null || sudo apt-get install -y libfuse2t64

      - name: Install backend deps (including PyInstaller dev dep)
        working-directory: python
        run: uv sync --frozen --all-groups

      - name: Bundle backend with PyInstaller
        working-directory: python
        run: uv run pyinstaller ../installer/vajrastocks.spec --noconfirm

      # ── Packages ─────────────────────────────────────────────────────────
      - name: Build .deb
        run: bash installer/linux/build-deb.sh ${{ needs.version.outputs.version }}

      - name: Build .rpm
        run: bash installer/linux/build-rpm.sh ${{ needs.version.outputs.version }}

      - name: Build AppImage
        run: bash installer/linux/build-appimage.sh ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            release/VajraStocks.deb
            release/VajraStocks.rpm
            release/VajraStocks.AppImage
          retention-days: 1

  # ── 4. macOS — frontend + PyInstaller + DMG ───────────────────────────────
  build-macos:
    name: Build macOS DMG
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Update version in source files
        run: python python/scripts/update_version.py ${{ needs.version.outputs.version }}

      # ── Frontend ─────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ── Backend ──────────────────────────────────────────────────────────
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install system deps
        run: brew install unixodbc create-dmg

      - name: Set up macOS codesigning certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE_BASE64" ]]; then
            echo "No certificate — skipping codesign setup."
            exit 0
          fi
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)
          echo -n "$MACOS_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH

      - name: Install backend deps (including PyInstaller dev dep)
        working-directory: python
        run: uv sync --frozen --all-groups

      - name: Bundle backend with PyInstaller
        working-directory: python
        run: uv run pyinstaller ../installer/vajrastocks.spec --noconfirm

      - name: Build macOS DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash installer/macos/build-dmg.sh ${{ needs.version.outputs.version }}

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/VajraStocks.dmg
          retention-days: 1

  # ── 5. Publish GitHub Release ─────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    needs: [version, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Flatten artifacts into release/ directory
        run: |
          mkdir -p release
          find release-assets/ -type f \
            \( -name "*.exe" -o -name "*.deb" -o -name "*.rpm" \
               -o -name "*.AppImage" -o -name "*.dmg" \) \
            -exec cp {} release/ \;

      - name: Generate release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          PREV_TAG=$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed -n '2p' || true)
          if [[ -n "${PREV_TAG}" ]]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" \
              | head -40 > /tmp/commits.txt
          else
            git log --pretty=format:"- %s (%h)" | head -40 > /tmp/commits.txt
          fi
          python3 installer/gen_release_notes.py "${VERSION}" /tmp/commits.txt

      - name: Generate checksums
        run: |
          cd release
          sha256sum $(ls *.exe *.deb *.rpm *.AppImage *.dmg 2>/dev/null) \
            > Checksums.txt || true
          cat Checksums.txt

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: VajraStocks v${{ needs.version.outputs.version }}
          body_path: release/ReleaseNotes.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release/VajraStocks-Setup.exe
            release/VajraStocks.deb
            release/VajraStocks.rpm
            release/VajraStocks.AppImage
            release/VajraStocks.dmg
            release/ReleaseNotes.md
            release/Checksums.txt
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
