name: Continuous Integration & Deployment Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build & Package Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm install

      - name: Build Production Frontend Bundle
        working-directory: frontend
        run: |
          npm run build

      - name: Compress Frontend Build Artifacts (Zip)
        run: |
          cd frontend
          zip -r ../frontend-build.zip dist/

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-bundle
          path: frontend-build.zip
          retention-days: 7

  build-backend:
    name: Build & Package Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv Package Manager
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync Backend Dependencies
        run: |
          uv sync --frozen

      - name: Run Ruff Linting & Checks
        run: |
          uv run ruff check src/ tests/ --exit-zero

      - name: Compress Backend Source & Config (Zip)
        run: |
          zip -r backend-build.zip src/ config/ migrations/ pyproject.toml uv.lock alembic.ini

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-production-bundle
          path: backend-build.zip
          retention-days: 7
