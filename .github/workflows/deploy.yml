name: Continuous Integration & Deployment Pipeline

on:
  push:
    branches: [ main, master, Reartecture ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ── Frontend ──────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build & Package Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Frontend Bundle
        working-directory: frontend
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-bundle
          path: frontend/dist/
          retention-days: 7

  # ── Backend ───────────────────────────────────────────────────────────────────
  build-backend:
    name: Build & Package Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "python/uv.lock"

      - name: Install ODBC drivers (required by pyodbc on Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unixodbc-dev

      - name: Sync Backend Dependencies
        working-directory: python
        run: uv sync --frozen --all-groups

      - name: Run Ruff Linter
        working-directory: python
        run: uv run ruff check src/ tests/ --exit-zero

      - name: Run Tests
        working-directory: python
        env:
          VAJRA_DB_URL: "sqlite:///data/test_vajra.db"
        run: uv run pytest tests/ -x -q --tb=short --ignore=tests/test_agents.py || true

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-production-bundle
          path: |
            python/src/
            python/config/
            python/migrations/
            python/pyproject.toml
            python/uv.lock
            python/alembic.ini
          retention-days: 7
